name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Linux runners only: macOS and Windows binaries are cross-compiled and
# type-checked from Linux, so no macOS or Windows minutes are used.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-compile and vet for macOS and Windows
        run: |
          set -euo pipefail
          for target in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./...
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./...
          done

  install-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse install.ps1 with PowerShell on Linux
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
          Write-Output "install.ps1 parses cleanly"
